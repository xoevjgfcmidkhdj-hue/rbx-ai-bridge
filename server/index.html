<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RBX AI Bridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: rgba(20, 20, 20, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #4ade80;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(74, 222, 128, 0.1), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.1), transparent 30%),
                radial-gradient(circle at 50% 80%, rgba(239, 68, 68, 0.1), transparent 30%);
            background-attachment: fixed;
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: fixed;
            height: 100%;
            z-index: 100;
            transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .new-chat-btn { background: transparent; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; cursor: pointer; width: calc(100% - 40px); margin: 10px 20px; transition: 0.2s; font-weight: 500; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.1); }
        
        .script-box { padding: 20px; border-top: 1px solid var(--border); margin-top: auto; }
        .script-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .script-code { background: #000; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; color: var(--primary); word-break: break-all; border: 1px solid var(--border); margin-bottom: 10px; }
        .copy-btn { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; }
        .copy-btn:hover { background: #22c55e; }

        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100vh; }
        
        .topbar { 
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            padding: 0 15px; 
            background: var(--surface); 
            backdrop-filter: blur(16px); 
            border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; gap: 15px;
            z-index: 50;
        }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .status-dot.connected { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .status-text { color: var(--text-muted); }
        .status-text span { color: white; font-weight: bold; }

        /* Chat Area */
        .chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 80px 15px 80px 15px; /* เผื่อพื้นที่ให้ topbar และ input */
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .message { display: flex; flex-direction: column; max-width: 85%; }
        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; border: 1px solid var(--border); word-wrap: break-word; }
        .message.user .bubble { background: var(--secondary); color: white; border-bottom-right-radius: 4px; border: none; }
        .message.ai .bubble { background: rgba(255,255,255,0.05); border-bottom-left-radius: 4px; }
        .bubble pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 8px; font-family: monospace; font-size: 13px; color: var(--primary); border: 1px solid #333; }
        
        /* Input Area */
        .input-area { 
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 15px; 
            background: var(--surface); 
            backdrop-filter: blur(16px); 
            border-top: 1px solid var(--border); 
            display: flex; gap: 10px; 
            z-index: 50;
        }
        .input-box { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; padding: 0 15px; border-radius: 24px; outline: none; font-size: 15px; transition: 0.2s; }
        .input-box:focus { border-color: var(--primary); }
        .send-btn { background: var(--primary); border: none; color: #000; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; transition: 0.2s; flex-shrink: 0; }
        .send-btn:hover { transform: scale(1.05); background: #22c55e; }
        .send-btn:disabled { background: gray; cursor: not-allowed; transform: none; }

        .typing { display: none; font-size: 13px; color: var(--text-muted); padding: 0 15px 10px 15px; position: fixed; bottom: 75px; }
        .typing.show { display: block; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 style="font-size: 18px;">ประวัติแชท</h2>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">+ สร้างแชทใหม่</button>
        <div class="script-box">
            <div class="script-title">สคริปต์สำหรับ Delta</div>
            <div class="script-code">loadstring(game:HttpGet("https://raw.githubusercontent.com/xoevjgfcmidkhdj-hue/rbx-ai-bridge/main/loader.luau"))()</div>
            <button class="copy-btn" onclick="copyScript()">คัดลอกสคริปต์</button>
        </div>
    </div>

    <!-- Main Area -->
    <div class="main">
        <div class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="status-badge">
                <div class="status-dot" id="status-dot"></div>
                <div class="status-text" id="status-text">กำลังเชื่อมต่อ...</div>
            </div>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="message ai">
                <div class="bubble">สวัสดีครับ! ผมคือ AI ผู้ช่วยของคุณ พิมพ์คำสั่งเพื่อให้ผมดูข้อมูลเกม หรือเขียนสคริปต์ให้คุณได้เลยครับ</div>
            </div>
        </div>

        <div class="typing" id="typing">AI กำลังคิด...</div>

        <div class="input-area">
            <input type="text" class="input-box" id="chat-input" placeholder="พิมพ์ข้อความ..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentRoom = "default";

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        
        function copyScript() {
            navigator.clipboard.writeText('loadstring(game:HttpGet("https://raw.githubusercontent.com/xoevjgfcmidkhdj-hue/rbx-ai-bridge/main/loader.luau"))()').then(() => alert('คัดลอกสคริปต์แล้ว!'));
        }

        function addMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            let formattedText = text.replace(/```lua([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            msgDiv.innerHTML = `<div class="bubble">${formattedText}</div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            document.getElementById('typing').classList.add('show');
            document.getElementById('send-btn').disabled = true;

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ room: currentRoom, message: text })
                });
                const data = await res.json();
                addMessage(data.reply, 'ai');
            } catch (e) {
                addMessage("❌ ไม่สามารถเชื่อมต่อกับ Server ได้", 'ai');
            } finally {
                document.getElementById('typing').classList.remove('show');
                document.getElementById('send-btn').disabled = false;
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        
        function startNewChat() {
            document.getElementById('chat-container').innerHTML = `<div class="message ai"><div class="bubble">เริ่มการสนทนาใหม่แล้ว!</div></div>`;
            toggleSidebar();
        }

        async function checkStatus() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                const dot = document.getElementById('status-dot');
                const txt = document.getElementById('status-text');
                if (data.rooms && data.rooms.includes(currentRoom)) {
                    dot.classList.add('connected'); txt.innerHTML = `เชื่อมต่อ <span>${currentRoom}</span>`;
                } else {
                    dot.classList.remove('connected'); txt.innerHTML = `ไม่ได้เชื่อมต่อ`;
                }
            } catch (e) {
                document.getElementById('status-dot').classList.remove('connected');
                document.getElementById('status-text').innerHTML = `เซิร์ฟเวอร์ออฟไลน์`;
            }
        }
        setInterval(checkStatus, 3000);
        checkStatus();
    </script>
</body>
</html>
